[project]
name = "mgx-demand-check"
version = "0.1.0"
description = "Anonymous buyer-demand check for business owners, with consent-first opt-in and an advisor dashboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demandcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
